appId: pk.restaurantpos.kitchen
productName: Kitchen POS Pakistan
directories:
  output: dist-electron
files:
  - backend/dist/**/*
  - frontend/dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: backend/src/db/migrations
    to: migrations
win:
  target: nsis
mac:
  target: dmg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish: null
