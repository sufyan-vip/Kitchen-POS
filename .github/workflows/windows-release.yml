name: Build Kitchen POS Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Kitchen POS Windows Installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          Write-Host "Checking Visual Studio installation..."
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

      - name: Initialize MSVC environment
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VC\Auxiliary\Build\vcvars64.bat
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VC\Auxiliary\Build\vcvars64.bat`) do call "%%i"

          where cl
          cl

      - name: Configure npm for Visual Studio 2022
        shell: pwsh
        run: |
          npm config set msvs_version 2022
          npm config set python "${env:pythonLocation}\python.exe"

          Write-Host "Node:"
          node --version

          Write-Host "npm:"
          npm --version

          Write-Host "Python:"
          python --version

      - name: Install dependencies
        shell: pwsh
        env:
          npm_config_msvs_version: "2022"
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          npm ci

      - name: Verify native compiler
        shell: pwsh
        run: |
          where.exe cl
          cl.exe 2>&1 | Select-Object -First 5

      - name: Rebuild better-sqlite3 for Electron
        shell: pwsh
        env:
          npm_config_msvs_version: "2022"
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          npx electron-rebuild -f -w better-sqlite3

      - name: Run backend tests
        shell: pwsh
        run: |
          npm run test

      - name: Run frontend tests
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run test

      - name: Build application
        shell: pwsh
        run: |
          npm run build

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          npm_config_msvs_version: "2022"
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          npx electron-builder --win nsis --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          Write-Host "Installer files:"
          Get-ChildItem -Path dist-electron -Recurse -File |
            Where-Object {
              $_.Extension -in ".exe", ".yml", ".yaml"
            } |
            Select-Object FullName, Length

          $installer = Get-ChildItem -Path dist-electron -Recurse -Filter "*.exe" -File

          if (-not $installer) {
            Write-Error "ERROR: No Windows .exe installer was produced."
            exit 1
          }

          Write-Host "SUCCESS: Windows installer found:"
          $installer | Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Kitchen-POS-Windows-Installer
          path: |
            dist-electron/**/*.exe
            dist-electron/**/*.blockmap
            dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 30
