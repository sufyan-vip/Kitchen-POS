name: Build Kitchen POS Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Kitchen POS Windows Installer
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio C++ build tools were not found."
          }

          Write-Host "Visual Studio: $vsPath"

          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"

          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat was not found at $vcvars"
          }

          "VS_INSTALL_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCVARS_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize MSVC environment
        shell: pwsh
        run: |
          $envDump = & cmd.exe /c "`"$env:VCVARS_PATH`" && set"

          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]

              if ($name -eq "PATH") {
                $value | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
              elseif ($name -notmatch '^(PROMPT|_=)$') {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

          Write-Host "MSVC environment initialized."

      - name: Verify MSVC compiler
        shell: pwsh
        run: |
          Write-Host "Checking cl.exe..."
          where.exe cl.exe

          if ($LASTEXITCODE -ne 0) {
            throw "cl.exe is not available in PATH."
          }

          cl.exe 2>&1 | Select-Object -First 5

      - name: Configure npm
        shell: pwsh
        run: |
          npm config set msvs_version 2022
          npm config set python "$env:pythonLocation\python.exe"

          Write-Host "Node:"
          node --version

          Write-Host "npm:"
          npm --version

          Write-Host "Python:"
          python --version

      - name: Install root dependencies
        shell: pwsh
        env:
          npm_config_msvs_version: "2022"
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          npm ci

      - name: Verify Electron
        shell: pwsh
        run: |
          Write-Host "Electron package:"
          node -p "require('./node_modules/electron/package.json').version"

          Write-Host "Electron binary:"
          if (Test-Path "node_modules/electron/dist/electron.exe") {
            Write-Host "Electron binary found."
          }
          else {
            throw "Electron binary was not installed."
          }

      - name: Rebuild better-sqlite3 for Electron
        shell: pwsh
        env:
          npm_config_msvs_version: "2022"
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          where.exe cl.exe
          cl.exe 2>&1 | Select-Object -First 5

          npx electron-rebuild -f -w better-sqlite3

      - name: Verify better-sqlite3 native module
        shell: pwsh
        run: |
          $native = Get-ChildItem `
            -Path "node_modules\better-sqlite3" `
            -Recurse `
            -Filter "*.node" `
            -File

          if (-not $native) {
            throw "better-sqlite3 native module was not produced."
          }

          Write-Host "Native module found:"
          $native | Select-Object FullName, Length

      - name: Run backend tests
        shell: pwsh
        run: |
          npm test

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci

      - name: Run frontend tests
        shell: pwsh
        working-directory: frontend
        run: |
          npm test

      - name: Build application
        shell: pwsh
        run: |
          npm run build

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          npm_config_msvs_version: "2022"
          npm_config_python: ${{ env.pythonLocation }}\python.exe
        run: |
          where.exe cl.exe

          npx electron-builder --win nsis --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          Write-Host "Searching for Windows installer..."

          if (-not (Test-Path "dist-electron")) {
            throw "dist-electron directory was not produced."
          }

          Get-ChildItem `
            -Path "dist-electron" `
            -Recurse `
            -File |
            Select-Object FullName, Length

          $installer = Get-ChildItem `
            -Path "dist-electron" `
            -Recurse `
            -Filter "*.exe" `
            -File

          if (-not $installer) {
            throw "ERROR: No Windows .exe installer was produced."
          }

          Write-Host ""
          Write-Host "SUCCESS: Windows installer produced:"
          $installer | Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Kitchen-POS-Windows-Installer
          path: |
            dist-electron/**/*.exe
            dist-electron/**/*.blockmap
            dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 30
