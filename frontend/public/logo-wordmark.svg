<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120" role="img" aria-label="S Restaurant Kitchen POS">
  <title>S Restaurant — Kitchen POS</title>
  <defs>
    <linearGradient id="srw-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#12704a"/>
      <stop offset="100%" stop-color="#053723"/>
    </linearGradient>
    <linearGradient id="srw-gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f7e2ad"/>
      <stop offset="42%" stop-color="#e2b95c"/>
      <stop offset="100%" stop-color="#b98526"/>
    </linearGradient>
    <mask id="srw-crescent">
      <rect width="440" height="120" fill="black"/>
      <circle cx="56" cy="62" r="30" fill="white"/>
      <circle cx="69" cy="57" r="27" fill="black"/>
    </mask>
  </defs>

  <rect x="4" y="10" width="100" height="100" rx="24" fill="url(#srw-bg)"/>
  <rect x="10" y="16" width="88" height="88" rx="19" fill="none" stroke="url(#srw-gold)" stroke-width="1.6"/>
  <rect width="440" height="120" fill="#57b98b" opacity="0.45" mask="url(#srw-crescent)"/>
  <text x="54" y="88" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700"
        fill="url(#srw-gold)">S</text>

  <text x="124" y="62"
        font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700"
        letter-spacing="0.5" fill="url(#srw-gold)">S Restaurant</text>
  <text x="126" y="90"
        font-family="Inter, system-ui, Segoe UI, sans-serif" font-size="14" letter-spacing="5"
        fill="#57b98b">KITCHEN &#183; POS</text>
</svg>
